[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "portpilot"
version = "0.1.1"
description = "Windows developer control center: what's on which port, WSL, Docker and the hosts file."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"

[project.scripts]
portpilot = "portpilot.cli:main"

[tool.setuptools]
packages = ["portpilot"]
